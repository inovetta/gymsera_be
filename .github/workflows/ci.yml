name: Backend CI

on:
  push:
    branches: [ main, master, 'phase/**', 'feature/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Lint once, not per shard (NEW-254).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # NEW-204: errors fail the build, warnings do not. tests/, scripts/ and the root one-off
      # scripts are linted after launch (spec §13 P10b).
      - name: Lint (src/)
        run: npm run lint:src

  # NEW-254: the suite runs in 3 shards at once, one runner each, so each shard has its own MySQL and
  # Redis (the harness uses fixed gymsera_test_* database names, so shards cannot share a server). Every
  # test file runs in exactly one shard (jest --shard); nothing is skipped.
  test-shard:
    name: test (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # Throwaway keys for this run only — generated, never committed.
      - name: Generate test-only keys
        run: |
          echo "TENANT_CONN_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Run test suites (shard ${{ matrix.shard }}/3)
        run: npm test -- --shard=${{ matrix.shard }}/3
        env:
          # Production runs without Redis (R-88); default CI environment matches it.
          DISABLE_REDIS: 'true'
          # Safety net only: the suite retained ~25 MB per test file until the rate limiter timers were
          # stopped after each file (tests/harness/release-limiter-timers.js), and ran out of the default
          # heap. 6 GB leaves room on the 7 GB runner; the real fix is the cleanup, not this number.
          NODE_OPTIONS: --max-old-space-size=6144
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: ''
          # The database settings the app reads — set explicitly so nothing
          # relies on a built-in default (SEC-DB-FALLBACK). The mysql service
          # above has MYSQL_ALLOW_EMPTY_PASSWORD=yes: root with an empty
          # password, reachable on 127.0.0.1:3306. Empty passwords are set
          # explicitly, which assertDatabaseConfigured accepts.
          PLATFORM_DB_HOST: 127.0.0.1
          PLATFORM_DB_PORT: 3306
          PLATFORM_DB_USER: root
          PLATFORM_DB_PASS: ''
          TENANT_DB_HOST: 127.0.0.1
          TENANT_DB_PORT: 3306
          TENANT_DB_ADMIN_USER: root
          TENANT_DB_ADMIN_PASS: ''
          TENANT_DB_USER: root
          TENANT_DB_PASS: ''
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret-key-at-least-32-chars-long
          # ZKTeco 50-device load test: the correctness checks always run; the timing limits are generous here
          # because shared runners vary by tens of ms (2019 ms against a 2000 ms limit). Only a slowdown of
          # seconds fails CI. The strict limits (2000 / 1000 ms) run with `npm run test:zk-load` before a release.
          ZK_LOAD_MAX_MS: '10000'
          ZK_LOAD_P95_MS: '5000'
          # ZKTeco Phase 4 push load test: same idea; strict limits (3000 / 1500 ms) with `npm run test:zk-push-load`.
          ZK_PUSH_LOAD_MAX_MS: '15000'
          ZK_PUSH_LOAD_P95_MS: '7500'
          ZK_PUSH_LOAD_PUSH_MS: '15000'

  # The required check keeps its name: `test` passes only when lint and every shard passed.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, test-shard]
    if: always()
    steps:
      - name: Every shard and lint passed
        env:
          LINT: ${{ needs.lint.result }}
          SHARDS: ${{ needs.test-shard.result }}
        run: |
          echo "lint: $LINT, test shards: $SHARDS"
          if [ "$LINT" != "success" ] || [ "$SHARDS" != "success" ]; then
            echo "::error::lint or a test shard did not succeed"
            exit 1
          fi
