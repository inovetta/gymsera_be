name: Secret scan

# SEC-05: scans only the commits a push or pull request adds, so a new secret fails the build.
# Old history is not scanned here: it holds findings recorded in the spec (SEC-SECRET-SCAN) that are
# rotated, not rewritten. To scan everything once by hand: `gitleaks git --no-banner .`

on:
  push:
    branches: [ main, master, 'phase/**', 'feature/**', 'phase-*/**' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned, checksum verified)
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the commits this push or pull request adds
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="origin/main..HEAD"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          echo "Scanning ${RANGE}"
          ./gitleaks git --no-banner --redact --exit-code 1 --log-opts="${RANGE}" .
